name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'releases/**'
      - 'scripts/publish-release.py'
      - '.github/workflows/publish-release.yml'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test ledger calculations and recovery
        run: pnpm test
      - name: Test native ledger, HSBC import and large history
        run: bash scripts/test-native.sh
      - name: Render production calendar on iPhone simulator
        run: bash scripts/test-calendar-rendering.sh
      - name: Upload calendar rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-rendering
          path: build/calendar-render/*.png
          if-no-files-found: warn
      - name: Render English UI screenshots
        run: bash scripts/test-screenshots.sh
      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-screenshots
          path: build/screenshots/*.png
          if-no-files-found: warn
      - name: Build application
        run: pnpm build
      - name: Sync native iOS project
        run: pnpm exec cap sync ios
      - name: Build real-device application without signing
        run: bash scripts/build-unsigned-ios.sh
      - name: Upload IPA for personal signing
        uses: actions/upload-artifact@v4
        with:
          name: StockLedger-unsigned-IPA
          path: |
            build/StockLedger-unsigned.ipa
            build/StockLedger-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
